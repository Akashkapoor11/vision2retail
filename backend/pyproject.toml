[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "ICN", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "error::DeprecationWarning:app",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py", "app/db/__init__.py", "app/api/__init__.py", "app/services/__init__.py", "app/workers/__init__.py", "app/core/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
